services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: cicd-app:local
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: local-1.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
