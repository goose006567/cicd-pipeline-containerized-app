name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --no-cache-dir -r app/requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  build-and-push:
    name: Build & push image to GHCR
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (tests run inside build stage)
        id: meta
        run: |
          docker build -f app/Dockerfile \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t ghcr.io/goose006567/cicd-app:ci-${{ github.sha }} .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CI image
        run: docker push ghcr.io/goose006567/cicd-app:ci-${{ github.sha }}
